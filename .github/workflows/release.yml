name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 1.6.0 (no leading v)"
        required: true

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="${{ inputs.version }}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Containerfile
          push: true
          tags: |
            ghcr.io/jallamasc/vf-cmdb-backend:latest
            ghcr.io/jallamasc/vf-cmdb-backend:v${{ steps.ver.outputs.version }}
          build-args: |
            VF_VERSION=${{ steps.ver.outputs.version }}
            VF_GIT_SHA=${{ steps.ver.outputs.sha }}
            VF_BUILT_AT=${{ github.event.repository.updated_at }}

      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Containerfile
          push: true
          tags: |
            ghcr.io/jallamasc/vf-cmdb-frontend:latest
            ghcr.io/jallamasc/vf-cmdb-frontend:v${{ steps.ver.outputs.version }}
          build-args: |
            VF_VERSION=${{ steps.ver.outputs.version }}
            VF_GIT_SHA=${{ steps.ver.outputs.sha }}
            VF_BUILT_AT=${{ github.event.repository.updated_at }}

      # Runs on BOTH trigger paths (no event_name guard). On a tag push the tag
      # v<version> already exists at github.sha; on workflow_dispatch the action
      # creates and pushes it at target_commitish. make_latest marks it the
      # GitHub "latest" release — the exact tag the backend latest_release_tag()
      # reads. Do NOT add logic that could move latest backward (finding 5).
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          generate_release_notes: true
