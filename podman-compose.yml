# ---------------------------------------------------------------------------
# Virtualfactor IT CMDB — Podman Compose stack
#
# Run with either:
#   podman compose up -d          (podman v4.7+ built-in compose)
#   podman-compose up -d          (the podman-compose Python tool)
#
# Notes for Podman:
#   * Volume mounts use the ":Z" suffix so SELinux (Fedora/RHEL/Rocky) relabels
#     them for the container. On non-SELinux hosts (Debian/Ubuntu) the ":Z" is
#     harmless and simply ignored.
#   * Builds reference "Containerfile" (Podman's native name) explicitly.
#   * Works rootless — all published host ports are >1024.
#   * For always-on production start-up, prefer the Quadlet units in
#     deploy/quadlet/ (systemd-managed). See README.
# ---------------------------------------------------------------------------
services:
  db:
    image: docker.io/library/postgres:16
    container_name: vf_cmdb_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vfcmdb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vfcmdb}
      POSTGRES_DB: ${POSTGRES_DB:-vfcmdb}
    volumes:
      - pgdata:/var/lib/postgresql/data:Z
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vfcmdb} -d ${POSTGRES_DB:-vfcmdb}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - cmdb

  backend:
    build:
      context: ./backend
      dockerfile: Containerfile
    image: localhost/vf_cmdb_backend:latest
    container_name: vf_cmdb_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vfcmdb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vfcmdb}
      POSTGRES_DB: ${POSTGRES_DB:-vfcmdb}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      API_PREFIX: ${API_PREFIX:-/api/v1}
      # Phase 5 Task 33/37/38 — Bitwarden Secrets Manager + Ansible Semaphore.
      # Both feature sets stay silently disabled (graceful degradation,
      # already covered by tests) until these are set in .env; empty
      # defaults here match config.py's own empty-string/0 defaults.
      BW_ORGANIZATION_ID: ${BW_ORGANIZATION_ID:-}
      BW_ACCESS_TOKEN: ${BW_ACCESS_TOKEN:-}
      BW_PROJECT_ID: ${BW_PROJECT_ID:-}
      BW_API_URL: ${BW_API_URL:-https://api.bitwarden.com}
      BW_IDENTITY_URL: ${BW_IDENTITY_URL:-https://identity.bitwarden.com}
      # SEMAPHORE_URL is also returned as-is to the frontend to build the
      # "Open in Semaphore" deep link (Req 31.3) — it must be reachable from
      # the operator's own browser, so use the same externally-published
      # address as SEMAPHORE_PORT below (e.g. http://<this-host>:3000), not
      # the internal "semaphore" container hostname.
      SEMAPHORE_URL: ${SEMAPHORE_URL:-}
      SEMAPHORE_API_TOKEN: ${SEMAPHORE_API_TOKEN:-}
      SEMAPHORE_PROJECT_ID: ${SEMAPHORE_PROJECT_ID:-0}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - cmdb

  frontend:
    build:
      context: ./frontend
      dockerfile: Containerfile
    image: localhost/vf_cmdb_frontend:latest
    container_name: vf_cmdb_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    networks:
      - cmdb

  pgadmin:
    image: docker.io/dpage/pgadmin4:latest
    container_name: vf_cmdb_pgadmin
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@virtualfactor.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin:/var/lib/pgadmin:Z
    networks:
      - cmdb

  # Phase 5 Task 36 (Req 29.1) — Ansible Semaphore: the Automation_Client
  # engine device automation runs against. SQLite-backed (single-host dev
  # deployment, no separate DB service needed — design.md's Sub-phase F
  # explicitly keeps Semaphore's own inventory/project data out of vf-cmdb's
  # Postgres). SEMAPHORE_ADMIN_PASSWORD / SEMAPHORE_ACCESS_KEY_ENCRYPTION
  # have NO hardcoded fallback here on purpose (unlike POSTGRES_PASSWORD's
  # ":-vfcmdb" dev-convenience default) — they must be generated once into
  # .env before first start; see README.md's Quick start section and
  # deploy/scripts/bootstrap.sh (which generates both automatically).
  semaphore:
    image: docker.io/semaphoreui/semaphore:latest
    container_name: vf_cmdb_semaphore
    restart: unless-stopped
    environment:
      SEMAPHORE_DB_DIALECT: sqlite
      SEMAPHORE_DB: /etc/semaphore/semaphore.sqlite
      SEMAPHORE_ADMIN: ${SEMAPHORE_ADMIN:-admin}
      SEMAPHORE_ADMIN_NAME: ${SEMAPHORE_ADMIN_NAME:-Admin}
      SEMAPHORE_ADMIN_EMAIL: ${SEMAPHORE_ADMIN_EMAIL:-admin@virtualfactor.local}
      SEMAPHORE_ADMIN_PASSWORD: ${SEMAPHORE_ADMIN_PASSWORD:?Generate one — see README.md Quick start (e.g. openssl rand -base64 24)}
      SEMAPHORE_ACCESS_KEY_ENCRYPTION: ${SEMAPHORE_ACCESS_KEY_ENCRYPTION:?Generate one — see README.md Quick start (openssl rand -base64 32)}
    volumes:
      - semaphore:/etc/semaphore:Z
    ports:
      - "${SEMAPHORE_PORT:-3000}:3000"
    networks:
      - cmdb

volumes:
  # Explicit, fixed volume names so podman-compose does NOT auto-prefix with the
  # project name. This keeps the compose path and the Quadlet path (deploy/quadlet/)
  # on the SAME physical volumes, preventing the dash/underscore divergence that
  # produces duplicate/orphan volumes and the "more than one result for volume
  # name" crash.
  pgdata:
    name: ${PGDATA_VOLUME:-vf-cmdb_pgdata}
  pgadmin:
    name: ${PGADMIN_VOLUME:-vf-cmdb_pgadmin}
  semaphore:
    name: ${SEMAPHORE_VOLUME:-vf-cmdb_semaphore}

networks:
  cmdb:
    driver: bridge
